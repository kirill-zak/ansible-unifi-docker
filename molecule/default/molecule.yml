---
driver:
  name: podman
platforms:
  - name: instance
    image: "${MOLECULE_DISTR:-kirillzak/docker-alpine-ansible}:${MOLECULE_TAG:-latest}"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    # Docker needs privileged mode to start the daemon inside the container.
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    pre_build_image: true
provisioner:
  name: ansible
scenario:
  # Collections (community.docker, community.general) and roles
  # (kirill_zak.docker) are provided by the environment: CI installs
  # requirements.yml/roles.yml before running molecule, and locally
  # 'make create-venv' installs them into the .ansible venv. The galaxy
  # dependency phase is therefore not needed; the sequence also skips the
  # optional prepare/cleanup/side_effect playbooks so molecule stays quiet.
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
verifier:
  name: ansible