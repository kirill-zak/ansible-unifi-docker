---
- name: Verify
  hosts: all
  tasks:
    - name: Get information about the UniFi data volume
      community.docker.docker_volume_info:
        name: unifi_data
      register: unifi_data_status

    - name: Does the UniFi data volume exist?
      ansible.builtin.assert:
        that:
          - unifi_data_status.exists

    - name: Get information about the UniFi log volume
      community.docker.docker_volume_info:
        name: unifi_log
      register: unifi_log_status

    - name: Does the UniFi log volume exist?
      ansible.builtin.assert:
        that:
          - unifi_log_status.exists

    - name: Get information about the UniFi cert volume
      community.docker.docker_volume_info:
        name: unifi_cert
      register: unifi_cert_status

    - name: Does the UniFi cert volume exist?
      ansible.builtin.assert:
        that:
          - unifi_cert_status.exists

    - name: Get information about the UniFi init.d volume
      community.docker.docker_volume_info:
        name: unifi_init.d
      register: unifi_init_status

    - name: Does the UniFi init.d volume exist?
      ansible.builtin.assert:
        that:
          - unifi_init_status.exists

    - name: Get information about the UniFi network
      community.docker.docker_network_info:
        name: unifi
      register: unifi_network_status

    - name: Does the UniFi network exist?
      ansible.builtin.assert:
        that:
          - unifi_network_status.exists

    - name: Get information about the UniFi container
      community.docker.docker_container_info:
        name: unifi
      register: unifi_container_status

    - name: Does the UniFi container exist?
      ansible.builtin.assert:
        that:
          - unifi_container_status.exists

    - name: Is the UniFi container running?
      ansible.builtin.assert:
        that:
          - unifi_container_status.container.State.Running