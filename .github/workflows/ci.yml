---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  config:
    uses: ./.github/workflows/config.yml

  test:
    name: Test ${{ matrix.entry.name }}
    needs: [lint, config]
    uses: ./.github/workflows/test-image.yml
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.config.outputs.tests) }}

    with:
      distro: ${{ matrix.entry.distro }}
      tag: ${{ matrix.entry.tag }}
      ref: ${{ github.sha }}

  test-gate:
    # Stable check name independent of the version matrix, so the branch
    # protection ruleset never needs updating when versions change.
    name: Test gate
    needs: [config, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required check did not pass
        run: |
          if [ "${{ needs.config.result }}" != success ] || \
             [ "${{ needs.test.result }}" != success ]; then
            echo "::error::config or test checks did not pass"
            exit 1
          fi
          echo "All required checks passed"