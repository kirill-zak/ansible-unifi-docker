---
name: Configuration

on:
  workflow_call:
    outputs:
      tests:
        description: JSON-массив тестовых пар (имя, образ, тег)
        value: ${{ jobs.config.outputs.tests }}

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.values.outputs.tests }}
    steps:
      - id: values
        run: |
          python3 - "$GITHUB_OUTPUT" <<'EOF'
          import json
          import sys
          tests = []
          for name, distro, tags in [
              ("AlmaLinux", "kirillzak/docker-almalinux-ansible", [
                  "8.5", "8.6", "8.7", "8.8", "8.9", "8.10",
                  "9.0", "9.1", "9.2", "9.3", "9.4", "9.5", "9.6", "9.7", "9.8",
              ]),
              ("Rocky Linux", "kirillzak/docker-rockylinux-ansible", [
                  "8.5", "8.6", "8.7", "8.8", "8.9",
                  "9.0", "9.1", "9.2", "9.3", "9.4", "9.5", "9.6", "9.7", "9.8",
              ]),
              ("Alpine", "kirillzak/docker-alpine-ansible", [
                  "3.22.0", "3.22.1", "3.22.2", "3.22.3", "3.22.4",
                  "3.23.0", "3.23.2", "3.23.3", "3.23.4",
              ]),
              ("Debian", "kirillzak/docker-debian-ansible", ["12", "13"]),
              ("Fedora", "kirillzak/docker-fedora-ansible", ["43", "44"]),
              ("Ubuntu", "kirillzak/docker-ubuntu-ansible", ["22.04", "24.04", "26.04"]),
          ]:
              for tag in tags:
                  tests.append({
                      "name": f"{name} {tag}",
                      "distro": distro,
                      "tag": tag,
                  })
          with open(sys.argv[1], "a") as f:
              f.write("tests=" + json.dumps(tests, separators=(",", ":")) + "\n")
          EOF