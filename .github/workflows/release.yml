---
name: Release
'on':
  push:
    tags:
      # Role release tags: x.x.x or x.xx.xx (optionally prefixed with 'v'),
      # e.g. '3.0.0' or 'v2.0.0'. Only such tags trigger a Galaxy release.
      # Glob dialect note: GitHub's tag filters use * (any chars), + (one or
      # more of the preceding), ? (zero or one). Use + so single-digit parts
      # match.
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest

    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Parse and validate tag
        run: |
          tag="${GITHUB_REF_NAME#v}"

          if [[ ! "$tag" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Unexpected tag '${GITHUB_REF_NAME}'. Expected x.x.x or x.xx.xx (e.g. '3.0.0', 'v2.0.0')."
            exit 1
          fi
          echo "Valid release tag: ${tag}"

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  config:
    uses: ./.github/workflows/config.yml

  test:
    name: Test ${{ matrix.entry.name }}
    needs: [lint, config]
    uses: ./.github/workflows/test-image.yml
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.config.outputs.tests) }}

    with:
      distro: ${{ matrix.entry.distro }}
      tag: ${{ matrix.entry.tag }}
      ref: ${{ github.sha }}

  test-gate:
    # Stable check name independent of the version matrix, so the branch
    # protection ruleset never needs updating when versions change.
    name: Test gate
    needs: [config, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required check did not pass
        run: |
          if [ "${{ needs.config.result }}" != success ] || \
             [ "${{ needs.test.result }}" != success ]; then
            echo "::error::config or test checks did not pass"
            exit 1
          fi
          echo "All required checks passed"

  release:
    name: Release
    runs-on: ubuntu-latest

    needs:
      - validate-tag
      - lint
      - test-gate

    steps:
      - name: Notify ansible-galaxy
        uses: robertdebock/galaxy-action@1.2.0
        with:
          galaxy_api_key: ${{ secrets.galaxy_api_key }}